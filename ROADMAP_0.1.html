<script id="canvas-data" type="application/json">{"nodes": [{"id": "idx_title", "type": "text", "text": "# THREE HORIZONS — ROADMAP 0.1\n**12 фаз · 231 шагов · готово 25** · база создана 2026-11-10 · [[ROADMAP_0.1]]\nКлик по ссылке в карточке фазы → отдельный канвас с крупными шагами.\nСтатусы берутся из `docs/PROGRESS.json`; критический путь: Ф0 → Ф1 → Ф2 → Ф6 → Ф8 → Ф9 → Ф10 → Ф11.", "x": 0, "y": -260, "width": 980, "height": 150, "color": "6"}, {"id": "idx_legend", "type": "text", "text": "**Как пользоваться**\n• 🟦 не начато · 🟨 в работе · 🟩 готово · 🟥 риск — цвет карточки-шага.\n• В карточке фазы: `phase-XX` — канвас шагов, `phase-XX-...` — полный текст.\n• Шаг закрыт, только когда выполнен критерий «✔ Готово, когда».\n• Статус шага: `python -X utf8 tools/make_progress.py 0.1 done` → пересобрать канвас.", "x": 1010, "y": -260, "width": 520, "height": 270, "color": "5"}, {"id": "ph0", "type": "text", "text": "# Ф0 · База и правила ⭐\n**Цель:** пустой, но полностью рабочий скелет проекта: структура папок, инструменты, гейты,\n\n**12 шагов · готово 12** · [[phase-00.canvas|открыть шаги]] · [[phase-00-baza|полный текст]]", "x": 0, "y": 0, "width": 660, "height": 198, "color": "4"}, {"id": "ph1", "type": "text", "text": "# Ф1 · Канон → данные ⭐\n**Цель:** перевести весь лор из `docs/` в машиночитаемые таблицы без Roblox-зависимостей.\n\n**13 шагов · готово 13** · [[phase-01.canvas|открыть шаги]] · [[phase-01-canon-to-data|полный текст]]", "x": 710, "y": 0, "width": 660, "height": 198, "color": "4"}, {"id": "ph2", "type": "text", "text": "# Ф2 · Масштаб и геометрия мира ⭐\n**Цель:** одна система мер и координат, по которой можно строить и город, и корабль, и небо.\n\n**10 шагов · готово 0** · [[phase-02.canvas|открыть шаги]] · [[phase-02-world-geometry|полный текст]]", "x": 1420, "y": 0, "width": 660, "height": 198, "color": "5"}, {"id": "ph3", "type": "text", "text": "# Ф3 · Визуальная библиотека (рендеры-эталоны) ⭐\n**Цель:** Рендер-эталон каждой модели игры — от пылинки 0.1 м до острова 1200×900 м. Чтобы по нему моделировали, а не по вкусовщине: эталон показывает реальный масштаб, пропорции и силуэт. Масштаб берётся из Ф2, палитры — из DESIGN_TOKENS.\n\n**10 шагов · готово 0** · [[phase-03.canvas|открыть шаги]] · [[phase-03-visual-library|полный текст]]", "x": 0, "y": 244, "width": 660, "height": 246, "color": "5"}, {"id": "ph4", "type": "text", "text": "# Ф4 · Арт-пайплайн (Blender → FBX → Roblox) ⭐\n**Цель:** воспроизводимый конвейер: скрипт в Blender → правильный FBX → проверка → импорт в Studio\n\n**12 шагов · готово 0** · [[phase-04.canvas|открыть шаги]] · [[phase-04-art-pipeline|полный текст]]", "x": 710, "y": 244, "width": 660, "height": 198, "color": "5"}, {"id": "ph5", "type": "text", "text": "# Ф5 · Текстурная библиотека (23 материала)\n**Цель:** Все 23 материала канона с полным набором карт (albedo/normal/roughness), бесшовные и строго в палитре DESIGN_TOKENS. Сейчас в плане 3 материала — остальные 20 нечем красить.\n\n**8 шагов · готово 0** · [[phase-05.canvas|открыть шаги]] · [[phase-05-texture-library|полный текст]]", "x": 1420, "y": 244, "width": 660, "height": 222, "color": "5"}, {"id": "ph6", "type": "text", "text": "# Ф6 · Ассеты v0.1 ⭐\n**Цель:** минимальный, но законченный ассет-пак, которого хватит на первый квартал столицы и один\n\n**14 шагов · готово 0** · [[phase-06.canvas|открыть шаги]] · [[phase-06-assets|полный текст]]", "x": 0, "y": 536, "width": 660, "height": 198, "color": "5"}, {"id": "ph7", "type": "text", "text": "# Ф7 · Roblox-каркас v0.1\n**Цель:** собираемый Rojo-проект с деревом модулей, конфигами из данных, сетью, сохранениями и\n\n**12 шагов · готово 0** · [[phase-07.canvas|открыть шаги]] · [[phase-07-roblox-skeleton|полный текст]]", "x": 710, "y": 536, "width": 660, "height": 198, "color": "5"}, {"id": "ph8", "type": "text", "text": "# Ф8 · Мир v0.1 ⭐\n**Цель:** один остров, один квартал столицы Арквейна, вода под островом, спавн и стриминг.\n\n**12 шагов · готово 0** · [[phase-08.canvas|открыть шаги]] · [[phase-08-world|полный текст]]", "x": 1420, "y": 536, "width": 660, "height": 198, "color": "5"}, {"id": "ph9", "type": "text", "text": "# Ф9 · Корабли v0.1\n**Цель:** один средний корпус, который стоит на воде у причала, слушается управления и везёт игрока\n\n**12 шагов · готово 0** · [[phase-09.canvas|открыть шаги]] · [[phase-09-ships|полный текст]]", "x": 0, "y": 780, "width": 660, "height": 198, "color": "5"}, {"id": "ph10", "type": "text", "text": "# Ф10 · Интерьеры (помещения корабля и зданий)\n**Цель:** Интерьер корабля — обязателен по Bible §4: рубка, каюта капитана, машинное, трюм, кубрик, оружейная. Плюс помещения зданий: дом, таверна, мастерская, склад, торговая контора. Сейчас в плане — «болванка», то есть пусто.\n\n**8 шагов · готово 0** · [[phase-10.canvas|открыть шаги]] · [[phase-10-interiors|полный текст]]", "x": 710, "y": 780, "width": 660, "height": 246, "color": "5"}, {"id": "ph11", "type": "text", "text": "# Ф11 · Облака и облачное море v0.1\n**Цель:** живое облачное море и погода, которые видно и которые влияют на игру. Без мешей —\n\n**12 шагов · готово 0** · [[phase-11.canvas|открыть шаги]] · [[phase-11-clouds|полный текст]]", "x": 1420, "y": 780, "width": 660, "height": 198, "color": "5"}, {"id": "ph12", "type": "text", "text": "# Ф12 · Бой, абордаж, захват корабля ⭐\n**Цель:** Захват со сменой владельца — ядро жанра, а не «потом». Ф9 обещал отдельную фазу: вот она. Огонь, абордаж, потеря части груза, уничтожение при критическом уроне, защита от повторной атаки. Всё по Bible §4, §6, §8.\n\n**9 шагов · готово 0** · [[phase-12.canvas|открыть шаги]] · [[phase-12-combat-capture|полный текст]]", "x": 0, "y": 1072, "width": 660, "height": 246, "color": "5"}, {"id": "ph13", "type": "text", "text": "# Ф13 · UI и звук v0.1 ⭐\n**Цель:** игра выглядит и звучит как Three Horizons, а не как тестовая сцена: единый стиль\n\n**12 шагов · готово 0** · [[phase-13.canvas|открыть шаги]] · [[phase-13-ui-audio|полный текст]]", "x": 710, "y": 1072, "width": 660, "height": 198, "color": "5"}, {"id": "ph14", "type": "text", "text": "# Ф14 · Звуковая библиотека (полный набор)\n**Цель:** Полный набор звуков по зонам (порт, рынок, мастерская, таверна, море, лес, каюта), погодные слои и 3 музыкальные темы. Ф13 делает 12–15 SFX на срез v0.1 — на полный мир нужен свой системный обход.\n\n**8 шагов · готово 0** · [[phase-14.canvas|открыть шаги]] · [[phase-14-sound-library|полный текст]]", "x": 1420, "y": 1072, "width": 660, "height": 222, "color": "5"}, {"id": "ph15", "type": "text", "text": "# Ф15 · Механики v0.1 (экономика, NPC, квест)\n**Цель:** один полный игровой цикл: выбрал фракцию/героя → пришёл в город → взял квест → купил\n\n**15 шагов · готово 0** · [[phase-15.canvas|открыть шаги]] · [[phase-15-mechanics|полный текст]]", "x": 0, "y": 1364, "width": 660, "height": 198, "color": "5"}, {"id": "ph16", "type": "text", "text": "# Ф16 · Локализация RU/EN ⭐\n**Цель:** Все игровые строки — в одной таблице с переводом на английский. Roblox — международная площадка: без EN игра не выходит за пределы СНГ. Плюс это запрещает вшивать текст в код: строка в коде — это строка, которую не переведёшь.\n\n**7 шагов · готово 0** · [[phase-16.canvas|открыть шаги]] · [[phase-16-localization|полный текст]]", "x": 710, "y": 1364, "width": 660, "height": 246, "color": "5"}, {"id": "ph17", "type": "text", "text": "# Ф17 · Флот NPC и офлайн-симуляция\n**Цель:** Мир не должен быть пустым между игроками: NPC-капитаны возят грузы по маршрутам, сервер считает их офлайн тиками (5 мин, кап 24 ч) вместо вечной физики каждого. Плюс общие события: одно пиратское нападение — одно на всех рядом, без копий (Bible §7).\n\n**8 шагов · готово 0** · [[phase-17.canvas|открыть шаги]] · [[phase-17-npc-fleet|полный текст]]", "x": 1420, "y": 1364, "width": 660, "height": 246, "color": "5"}, {"id": "ph18", "type": "text", "text": "# Ф18 · Сюжет: заговор трёх домов\n**Цель:** Цепочка квестов по Bible §3: все трое героев прибывают в Эстерхольм, их крючки срабатывают (пропавший отец, потерянный груз, налоги землевладельца), расследование выводит на Валькрофта, Сольвейна и Рейвенхолла. Без древнего зла — только люди и деньги (C-08).\n\n**8 шагов · готово 0** · [[phase-18.canvas|открыть шаги]] · [[phase-18-story-three-houses|полный текст]]", "x": 0, "y": 1656, "width": 660, "height": 246, "color": "5"}, {"id": "ph19", "type": "text", "text": "# Ф19 · Малые поселения и POI\n**Цель:** 7 названных поселений (Бронзовый Холм, Фарнвик, Редстоун, Вестпорт, Зелёная Долина, Ривервуд, Солнечная Ферма) плюс обломки, стоянки, укрытия — это и есть «мир, где есть чем заняться» между столицами. Сейчас в роадмапе нет ни слова про них.\n\n**8 шагов · готово 0** · [[phase-19.canvas|открыть шаги]] · [[phase-19-settlements|полный текст]]", "x": 710, "y": 1656, "width": 660, "height": 246, "color": "5"}, {"id": "ph20", "type": "text", "text": "# Ф20 · Вторая и третья фракция (полный объём)\n**Цель:** v0.1 — только Арквейн. Нужны полноценные Вальмер и Гринвальд: столицы, районы, ресурс, производство, специализации, NPC-торговцы, свои квесты, палитра. Иначе игра про одного острова, а Bible обещает три (Bible §2).\n\n**10 шагов · готово 0** · [[phase-20.canvas|открыть шаги]] · [[phase-20-factions-full|полный текст]]", "x": 1420, "y": 1656, "width": 660, "height": 246, "color": "5"}, {"id": "ph21", "type": "text", "text": "# Ф21 · QA, оптимизация, альфа\n**Цель:** доказать цифрами, что v0.1 играбельна: гейты закрыты, бюджеты соблюдены, сохранения\n\n**11 шагов · готово 0** · [[phase-21.canvas|открыть шаги]] · [[phase-21-qa-alpha|полный текст]]", "x": 0, "y": 1948, "width": 660, "height": 198, "color": "5"}, {"id": "d0", "type": "text", "text": "**S-01 · Метр в studs**\n3 или 3.571 в доках. Рекомендация: 3.571 (1 st = 0.28 м).", "x": 0, "y": 2382, "width": 470, "height": 126, "color": "3"}, {"id": "d1", "type": "text", "text": "**S-02 · Сжатие мира**\n1:10 vs 1:20. Рекомендация: 1:10 по горизонтали и вертикали.", "x": 500, "y": 2382, "width": 470, "height": 126, "color": "3"}, {"id": "d2", "type": "text", "text": "**S-03 · Размер карты**\n18×26 км игровых; 168 км² — лор-текст.", "x": 1000, "y": 2382, "width": 470, "height": 102, "color": "3"}, {"id": "d3", "type": "text", "text": "**S-04 · Шард**\n60 игроков на старте, поднять после профилирования.", "x": 0, "y": 2572, "width": 470, "height": 102, "color": "3"}, {"id": "d4", "type": "text", "text": "**S-05 · Вода**\nTerrain-вода только near-зоной 2–4 км + туман на горизонте.", "x": 500, "y": 2572, "width": 470, "height": 126, "color": "3"}, {"id": "d5", "type": "text", "text": "**S-06 · Облака**\nМеш-облака запрещены. Слои: Clouds + клочья + Atmosphere.", "x": 1000, "y": 2572, "width": 470, "height": 126, "color": "3"}, {"id": "dec_group", "type": "group", "label": "РЕШЕНИЯ ДО СТАРТА · Ф0.11 → [[DECISIONS]]", "x": 0, "y": 2302, "width": 1480, "height": 520}, {"id": "grabli", "type": "text", "text": "**Грабли — читать перед каждым шагом**\n• Меш-облака = «вата»: нет просвечивания и мягкого края.\n• `AlignPosition` OneAttachment держит XZ → корабль не разгоняется.\n• `Enum.OrientationAlignmentMode`, а не выдуманный тип.\n• `Enum.Font.Serif` не существует → Garamond / Merriweather.\n• `StarterPlayerScripts` нельзя репарентать.\n• `Clouds` только под `Workspace.Terrain`.\n• FBX в Studio — только руками (3D Importer).\n• EditableMesh на клиенте ≈ 8 мешей.\n• `Terrain.Size` read-only, но FillBall/FillBlock пишут и дальше.\n• Blender — `--threads 2`, BelowNormal.\n• Пивот — в основании по центру; MeshPart ≤ 9 500 tri.", "x": 1540, "y": 2382, "width": 620, "height": 342, "color": "1"}, {"id": "grabli_group", "type": "group", "label": "ГРАБЛИ", "x": 1520, "y": 2302, "width": 660, "height": 640}], "edges": [{"id": "ie0", "fromNode": "ph0", "fromSide": "right", "toNode": "ph1", "toSide": "left", "color": "5"}, {"id": "ie1", "fromNode": "ph1", "fromSide": "right", "toNode": "ph2", "toSide": "left", "color": "5"}, {"id": "ie2", "fromNode": "ph2", "fromSide": "bottom" <script>
const RAW = JSON.parse(document.getElementById('canvas-data').textContent);
const STORE = 'th-roadmap-0.1-glass';
const ORDER = ['5','3','4','1','6','2'];
const COLOR_NAME = {'1':'риск/блокер','2':'оранжевый','3':'в работе','4':'готово','5':'не начато','6':'канон'};

const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const svg = document.getElementById('edges');
let scale = 0.6, tx = 40, ty = 40, nodeMap = new Map();

function load() {
  const base = JSON.parse(JSON.stringify(RAW));
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) {
      for (const n of base.nodes) {
        const s = saved[n.id];
        if (!s) continue;
        if (typeof s.text === 'string') n.text = s.text;
        if (typeof s.color === 'string') n.color = s.color;
      }
    }
  } catch (e) { /* ignore */ }
  return base;
}
function save() {
  const out = {};
  for (const n of state.nodes) {
    const b = RAW.nodes.find(x => x.id === n.id);
    if (b && (b.text !== n.text || b.color !== n.color)) out[n.id] = {text: n.text, color: n.color};
  }
  localStorage.setItem(STORE, JSON.stringify(out));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderText(s) {
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\[\[([^\]]+)\]\]/g, '<span class="wl">🔗 $1</span>');
  return h;
}
function bounds() {
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for (const n of state.nodes) {
    x1=Math.min(x1,n.x); y1=Math.min(y1,n.y);
    x2=Math.max(x2,n.x+n.width); y2=Math.max(y2,n.y+n.height);
  }
  return {x1,y1,x2,y2,w:x2-x1,h:y2-y1};
}
function apply() {
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}
function fit() {
  const b = bounds(), vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw/(b.w+120), vh/(b.h+120), 1.2);
  tx = (vw - b.w*scale)/2 - b.x1*scale;
  ty = (vh - b.h*scale)/2 - b.y1*scale;
  apply();
}
function build() {
  document.querySelectorAll('.card,.group').forEach(e => e.remove());
  const b = bounds();
  stage.style.width = (b.x2 - b.x1 + 40) + 'px';
  stage.style.height = (b.y2 - b.y1 + 40) + 'px';
  svg.setAttribute('width', b.w + 200); svg.setAttribute('height', b.h + 200);

  nodeMap.clear();
  const cardLayer = document.createElement('div');
  for (const n of state.nodes) {
    if (n.type === 'group') {
      const g = document.createElement('div');
      g.className = 'group';
      g.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.width}px;height:${n.height}px`;
      const l = document.createElement('div');
      l.className = 'glabel';
      l.textContent = n.label || '';
      g.appendChild(l);
      stage.appendChild(g);
    } else {
      const c = document.createElement('div');
      c.className = 'card s' + (n.color || '0');
      c.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.width}px;height:${n.height}px`;
      c.dataset.id = n.id;
      const t = document.createElement('div');
      t.className = 'txt';
      t.innerHTML = renderText(n.text || '');
      c.appendChild(t);
      c.addEventListener('dblclick', ev => { ev.stopPropagation(); editCard(n, c); });
      c.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); cycleColor(n, c); });
      stage.appendChild(c);
    }
    nodeMap.set(n.id, n);
  }
  drawEdges();
  countStats();
}
function drawEdges() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  for (const e of state.edges || []) {
    const a = nodeMap.get(e.fromNode), b = nodeMap.get(e.toNode);
    if (!a || !b) continue;
    const x1 = a.x + a.width, y1 = a.y + Math.min(a.height*0.25, 220);
    const x2 = b.x, y2 = b.y + Math.min(b.height*0.25, 220);
    const mx = (x1 + x2)/2;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', `M${x1},${y1} H${mx} V${y2} H${x2}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', e.color === '1' ? '#fb464c' : '#4c8f9e');
    p.setAttribute('stroke-width','2');
    p.setAttribute('opacity','.75');
    svg.appendChild(p);
    const ah = document.createElementNS('http://www.w3.org/2000/svg','path');
    ah.setAttribute('d', `M${x2},${y2} l-7,-4 v8 z`);
    ah.setAttribute('fill', e.color === '1' ? '#fb464c' : '#4c8f9e');
    svg.appendChild(ah);
  }
}
function editCard(n, el) {
  if (el.querySelector('textarea')) return;
  el.classList.add('edit');
  el.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.value = n.text;
  el.appendChild(ta);
  ta.focus();
  const done = () => {
    n.text = ta.value;
    el.classList.remove('edit');
    el.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'txt';
    t.innerHTML = renderText(n.text);
    el.appendChild(t);
    save(); countStats();
    toast('Сохранено (в браузере). Для файла — «Скачать .canvas»');
  };
  ta.addEventListener('blur', done);
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ta.value = n.text; ta.blur(); }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) ta.blur();
  });
}
function cycleColor(n, el) {
  const idx = ORDER.indexOf(n.color || '5');
  n.color = ORDER[(idx + 1) % ORDER.length];
  el.className = 'card s' + n.color;
  save(); countStats();
  toast('Статус: ' + (COLOR_NAME[n.color] || n.color));
}
function countStats() {
  const c = {5:0,3:0,4:0,1:0};
  for (const n of state.nodes) if (n.type !== 'group') c[n.color] = (c[n.color]||0)+1;
  document.getElementById('stats').textContent =
    `🟦 ${c['5']||0} · 🟨 ${c['3']||0} · 🟩 ${c['4']||0} · 🟥 ${c['1']||0}`;
}
// панорама
let drag = null;
viewport.addEventListener('mousedown', ev => {
  if (ev.target.closest('.card')) return;
  drag = {x: ev.clientX, y: ev.clientY, tx, ty};
  viewport.classList.add('drag');
});
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  tx = drag.tx + (ev.clientX - drag.x);
  ty = drag.ty + (ev.clientY - drag.y);
  apply();
});
window.addEventListener('mouseup', () => { drag = null; viewport.classList.remove('drag'); });
// зум
viewport.addEventListener('wheel', ev => {
  ev.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const k = ev.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(Math.max(scale * k, 0.12), 3);
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  apply();
}, {passive:false});
// кнопки
document.getElementById('btn-fit').onclick = fit;
document.getElementById('btn-reset').onclick = () => {
  if (!confirm('Сбросить все правки (тексты и цвета) к исходному роадмапу?')) return;
  localStorage.removeItem(STORE);
  state = load(); build(); fit();
  toast('Правки сброшены');
};
document.getElementById('btn-export').onclick = () => {
  const out = JSON.parse(JSON.stringify(state));
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ROADMAP_0.1.canvas';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Скачан ROADMAP_0.1.canvas — замените файл в проекте');
};
build(); fit();
window.addEventListener('resize', apply);
</script>
</body>
</html>
